<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ilustracao de ciclo menstrual com privacidade</title>
  <desc id="desc">Arte vetorial sem texto com calendario, ciclo circular e gota em tons suaves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4f7" />
      <stop offset="100%" stop-color="#eef6ff" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#334155" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="115" cy="95" r="120" fill="#ffe4ea" opacity="0.85" />
  <circle cx="1075" cy="535" r="165" fill="#dbeafe" opacity="0.75" />
  <circle cx="1035" cy="110" r="72" fill="#fee2e2" opacity="0.72" />

  <g filter="url(#shadow)">
    <rect x="95" y="85" width="1010" height="460" rx="30" fill="url(#card)" />
  </g>

  <!-- Calendario -->
  <g transform="translate(160 165)">
    <rect x="0" y="0" width="300" height="300" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
    <rect x="0" y="0" width="300" height="62" rx="24" fill="#ffe4ec" />
    <rect x="28" y="92" width="50" height="50" rx="10" fill="#f1f5f9" />
    <rect x="92" y="92" width="50" height="50" rx="10" fill="#f1f5f9" />
    <rect x="156" y="92" width="50" height="50" rx="10" fill="#f1f5f9" />
    <rect x="220" y="92" width="50" height="50" rx="10" fill="#f1f5f9" />

    <rect x="28" y="156" width="50" height="50" rx="10" fill="#f1f5f9" />
    <rect x="92" y="156" width="50" height="50" rx="10" fill="#ffe4ea" />
    <rect x="156" y="156" width="50" height="50" rx="10" fill="#fecdd3" />
    <rect x="220" y="156" width="50" height="50" rx="10" fill="#ffe4ea" />

    <rect x="28" y="220" width="50" height="50" rx="10" fill="#f1f5f9" />
    <rect x="92" y="220" width="50" height="50" rx="10" fill="#f1f5f9" />
    <rect x="156" y="220" width="50" height="50" rx="10" fill="#f1f5f9" />
    <rect x="220" y="220" width="50" height="50" rx="10" fill="#f1f5f9" />
  </g>

  <!-- Ciclo -->
  <g transform="translate(555 140)">
    <circle cx="195" cy="180" r="128" fill="none" stroke="#fde2e8" stroke-width="28" />
    <circle cx="195" cy="180" r="128" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round" stroke-dasharray="560 220" transform="rotate(-35 195 180)" />
    <path d="M335 94l30-2-15 26" fill="#f43f5e" />

    <circle cx="195" cy="180" r="80" fill="#fff1f4" />

    <!-- Gota -->
    <path d="M195 118c-26 38-40 58-40 80 0 22 18 40 40 40s40-18 40-40c0-22-14-42-40-80z" fill="#f43f5e" />
    <circle cx="184" cy="188" r="9" fill="#fb7185" />
  </g>

  <!-- Elementos de privacidade sem texto -->
  <g transform="translate(895 200)">
    <rect x="0" y="0" width="150" height="210" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="4" />
    <rect x="28" y="30" width="94" height="14" rx="7" fill="#e2e8f0" />
    <rect x="28" y="56" width="94" height="14" rx="7" fill="#e2e8f0" />
    <rect x="28" y="82" width="70" height="14" rx="7" fill="#e2e8f0" />
    <path d="M74 132c-20 0-39 7-54 19v45c0 46 27 82 54 94 27-12 54-48 54-94v-45c-15-12-34-19-54-19z" fill="#fda4af" />
    <path d="M74 158a20 20 0 0 0-20 19v6h-7a7 7 0 0 0-7 7v28a7 7 0 0 0 7 7h54a7 7 0 0 0 7-7v-28a7 7 0 0 0-7-7h-7v-6a20 20 0 0 0-20-19zm0 10a10 10 0 0 1 10 9v6H64v-6a10 10 0 0 1 10-9z" fill="#fff" />
  </g>
</svg>
